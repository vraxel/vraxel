name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Store-layer integration tests (pkg/db/dbtest) hit this instance;
    # without it they skip. TEST_DB_* defaults match these credentials.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vraxel
          POSTGRES_PASSWORD: vraxel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vraxel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate as local `make check`: gofmt, vet, layer guard,
      # Go tests, UI typecheck + prettier/eslint/boundaries + vitest.
      - run: make check

      # Race pass is too slow to gate locally (~10x) but cheap in CI.
      - run: go test -race ./...

      # The release path must stay green: frontend build + static binary.
      - run: make build
