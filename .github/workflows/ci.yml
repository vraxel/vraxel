name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate as local `make check`: gofmt, vet, layer guard,
      # Go tests, UI typecheck + prettier/eslint/boundaries + vitest.
      - run: make check

      # Race pass is too slow to gate locally (~10x) but cheap in CI.
      - run: go test -race ./...

      # The release path must stay green: frontend build + static binary.
      - run: make build
