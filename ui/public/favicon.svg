<!-- Vraxel mark. Identical geometry and tones to
     src/shared/components/brand-mark.tsx, with the component's currentColor
     resolved to the sRGB of the primary token. No tile, transparent
     background, so the tab icon is the same object as the one in the sidebar.
     Keep this comment free of consecutive hyphens. XML forbids them inside a
     comment, and a browser loading an SVG as an image parses it strictly, so
     a single stray pair makes the whole favicon fail to load and the tab
     silently falls back to whatever /favicon.ico serves. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <g fill="#3e60e5">
    <path d="M16 16 L22.5 12.25 L29 16 L22.5 19.75 Z" opacity="0.55"/>
    <path d="M16 11.5 L22.5 7.75 L22.5 12.25 L16 16 Z"/>
    <path d="M16 4 L3 11.5 L16 19 L22.5 15.25 L16 11.5 L22.5 7.75 Z" opacity="0.45"/>
    <path d="M3 11.5 L16 19 L16 28 L3 20.5 Z" opacity="0.7"/>
    <path d="M22.5 15.25 L16 19 L16 28 L29 20.5 L29 16 L22.5 19.75 Z"/>
  </g>
</svg>
