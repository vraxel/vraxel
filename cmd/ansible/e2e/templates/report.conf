# Rendered by the template module. Every line exercises a filter that has no
# Sprig equivalent, so a wrong value here means the filter regressed.
enabled={{ .services | selectattr "enabled" | mapattr "name" | join "," }}
db_tier={{ .services | selectattr "tier" "db" | mapattr "name" | join "," }}
dropped={{ .services | rejectattr "enabled" | mapattr "name" | join "," }}
flat={{ .nested_groups | flatten | join "," }}
tiers={{ .services | mapattr "tier" | uniq | sortAlpha | join "," }}
from_role={{ .role_marker }}
